# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Chain Bounding"
  description: >-
    Lean 4 formalization of the core results of "Chain bounding, the leanest
    proof of Zorn's lemma, and an illustration of computerized proof
    formalization" by Guillermo L. Incatasciato and Pedro Sánchez Terraf,
    published at the American Mathematical Monthly (preprint freely accessible
    at http://arxiv.org/abs/2404.11638). It formalizes the order-theoretic
    notion of _good chains_ for an "expander" of subsets of a poset: the
    comparability of good chains, the existence of a greatest good chain, the
    well-ordering of good chains for an expander of the form
    C ↦ C ∪ {f C}, the Chain Bounding Lemma (there is no assignment of a
    strict upper bound to every chain of a poset), the Unbounded Chain Lemma,
    and — as a novel, unified alternative to the classical ordinal-based
    arguments — derivations of both Zorn's Lemma and the Bourbaki–Witt fixed
    point theorem from Chain Bounding.
  authors:
    - "Pedro Sánchez Terraf"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Pedro Sánchez Terraf"

# Ordinary project: this submitted repository is the substantive proof
# development, so the `repository` block is omitted.

classification:
  arxiv: ["math.LO"]
  msc2020: ["03E25", "06A06"]

sources:
  - title: "Chain bounding, the leanest proof of Zorn's lemma, and an
      illustration of computerized proof formalization"
    authors:
      - "Guillermo L. Incatasciato"
      - "Pedro Sánchez Terraf"
    id: "http://dx.doi.org/10.1080/00029890.2025.2571375"
    type: "article"
    location: "537–557"
    relationship: "formalizes"
    note: "A preprint is freely accessible at
      http://arxiv.org/abs/2404.11638."
    author_endorsement: "participated"

related_formalizations:
  - id: "https://github.com/sterraf/ChainBounding"
    relationship: "other"
    note: "The original repository of this same development, whose `main` branch
      contains formalizations existing up to the moment of publication, and its
      `palomar-test` branch formalizes the extra result
      `OrderSelector.wellOrdered_of_good`; the present repository is its
      Palomar-compliant reorganization, with identical statements and proofs."

status:
  scope: >-
    Formalizes the paper's core results: comparability of good chains, the
    existence of a greatest good chain (th:greatest-good-chain),
    well-ordering of good chains for an expander C ↦ C ∪ {f C}
    (prop:good-well-ordered, proved including the verification left to the
    reader in the paper's proof), Chain Bounding (lem:chain-bounding), the
    Unbounded Chain Lemma (lem:unbounded-chain), and the corollaries on
    Zorn's Lemma and the Bourbaki–Witt fixed point theorem. Not formalized:
    the ZFC-equivalence corollary (cor:unbounded-implies-AC), the converse
    remark that every well-ordered chain is good for some expander, and the
    paper's methodological exposition.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

automation:
  methods:
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: "Interactive Lean 4 / Mathlib development of the original
        formalization (2024); no automation."
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "n/a"
    - method: "agent"
      models: ["GLM-5.3-Flash"]
      framework: "OpenCode"
      tool_setup: "AI-assisted port of the development to the current
        toolchain/Mathlib (2026) and formalization of prop:good-well-ordered;
        all proofs human-reviewed and machine-checked."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Iterative build-fix cycles driven by Lean diagnostics;
        no automated search beyond Mathlib tactics (simp, aesop, tauto)."
  spend_usd: "subscription-based"
  notes: "The original formalization was written by hand. In 2026 it was
    ported to the current toolchain and extended with
    prop:good-well-ordered with AI assistance under OpenCode at a branch of the
    original repository, and later formatted here for Palomar; every
    statement was checked against the paper's source and every proof was
    verified by Lean's kernel."

fidelity:
  divergences: >-
    (1) lem:unbounded-chain assumes AC in the paper; the Lean statement is
    for inhabited posets and its proof uses classical logic (Lean's
    Classical.choice, a permitted axiom). (2) Well-ordering in
    prop:good-well-ordered is rendered as the least-element property, with an
    equivalent WellFoundedOn rendering additionally proved in the proof
    module. (3) cor:unbounded-implies-AC is not formalized. No other
    divergences are known.

review:
  status: "self-assessed"
  reviewers:
    - "Pedro Sánchez Terraf"
  notes: "Statements audited against the paper's TeX source; development
    compiled with Lean v4.32.0 against a pinned Mathlib revision; axiom
    footprint of the advertised results checked with `#print axioms` (the
    standard three axioms only)."

alignment:
  namespace: "ChainBounding (with OrderExpander / OrderSelector /
    ChainBounding sub-namespaces; zorn, unbounded_chain and
    bourbaki_witt_of_complete are top-level)"
  statements:
    - source: "Theorem th:greatest-good-chain (Greatest Good Chain)"
      lean: "OrderExpander.greatest_good_chain"
      module: "Challenge"
      status: "proved"
      note: "The family of all good chains has a maximum under inclusion;
        `U` is defined as the union of all good chains, exactly as in the
        paper."
    - source: "Proposition prop:good-well-ordered"
      lean: "OrderSelector.wellOrdered_of_good"
      module: "Challenge"
      status: "proved"
      note: "The paper's proposition is itself restricted to the expander
        C ↦ C ∪ {f C} (the OrderSelector setting), so the restriction is
        faithful. Well-ordering is stated as the least-element property."
    - source: "Lemma lem:chain-bounding (Chain Bounding)"
      lean: "ChainBounding.chain_bounding"
      module: "Challenge"
      status: "proved"
      note: "Stated as the negation, as in the paper: the assumed existence
        of a strict-upper-bound assignment (OrderSelector + ChainBounding
        classes) leads to False."
    - source: "Lemma lem:unbounded-chain (Unbounded Chain)"
      lean: "unbounded_chain"
      module: "Challenge"
      status: "proved"
      note: "The paper invokes AC to select strict upper bounds; the Lean
        statement is for inhabited posets and its proof uses classical
        logic."
    - source: "Corollary [Zorn]"
      lean: "zorn"
      module: "Challenge"
      status: "proved"
      note: "Derived from the Unbounded Chain Lemma; this is part of the
        unified, ordinal-free approach highlighted in the paper.
        `IsMaximal` matches the paper's notion of maximal element."
    - source: "Corollary [Bourbaki-Witt]"
      lean: "bourbaki_witt_of_complete"
      module: "Challenge"
      status: "proved"
      note: "Directed-complete posets (CompletePartialOrder); also derived
        from Chain Bounding, sharing the unified approach noted for zorn."

acknowledgements: "Supported by Secyt-UNC project 33620230100751CB.
